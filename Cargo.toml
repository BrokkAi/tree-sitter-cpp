[package]
name = "brokk-tree-sitter-cpp"
description = "Brokk-maintained C++ grammar for the tree-sitter parsing library"
version = "0.24.8"
authors = [
  "Max Brunsfeld <maxbrunsfeld@gmail.com>",
  "Amaan Qureshi <amaanq12@gmail.com>",
]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "cpp"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/BrokkAi/tree-sitter-cpp"
homepage = "https://github.com/BrokkAi/tree-sitter-cpp"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "/LICENSE",
  "/bindings/rust/*",
  "/grammar.js",
  "/queries/*",
  "/src/**",
  "/tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[[test]]
name = "allocator_boundary"
path = "bindings/rust/tests/allocator_boundary.rs"
required-features = ["reuse-allocator"]

[[test]]
name = "grammar_without_runtime"
path = "bindings/rust/tests/grammar_without_runtime.rs"

[features]
# Consumers enabling this must link the Tree-sitter runtime allocator symbols.
reuse-allocator = []

[dependencies]
tree-sitter-language = "0.1"
tree-sitter = { version = ">=0.25.10, <0.27", optional = true }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = ">=0.25.10, <0.27"
