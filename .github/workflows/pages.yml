name: Deploy playground to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked JavaScript dependencies
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
      - name: Export playground with Pages-capable CLI
        run: |
          npx --yes --package=tree-sitter-cli@0.26.3 tree-sitter build --wasm
          npx --yes --package=tree-sitter-cli@0.26.3 tree-sitter playground --export site
          mv site/tree-sitter-parser.wasm site/tree-sitter-cpp.wasm
          sed -i 's/LANGUAGE_BASE_URL = ""/LANGUAGE_BASE_URL = "."/' site/index.html
          test -f site/tree-sitter-cpp.wasm
          grep -F 'LANGUAGE_BASE_URL = "."' site/index.html
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload playground
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
