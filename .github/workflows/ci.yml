name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - Cargo.toml
      - Cargo.lock
      - package.json
      - package-lock.json
      - pyproject.toml
      - setup.py
      - tree-sitter.json
      - go.mod
      - go.sum
      - Package.swift
      - Package.resolved
      - CMakeLists.txt
      - Makefile
      - .github/workflows/**
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - Cargo.toml
      - Cargo.lock
      - package.json
      - package-lock.json
      - pyproject.toml
      - setup.py
      - tree-sitter.json
      - go.mod
      - go.sum
      - Package.swift
      - Package.resolved
      - CMakeLists.txt
      - Makefile
      - .github/workflows/**

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser and Rust binding
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: "24"
      - name: Install locked JavaScript dependencies
        shell: bash
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npm rebuild
      - name: Verify generated parser
        shell: bash
        run: |
          npx tree-sitter generate --abi 15
          git diff --exit-code -- src
      - name: Run grammar corpus and highlight tests
        run: npx tree-sitter test
      - name: Build C binding
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build/c -DTREE_SITTER_CLI="$PWD/node_modules/.bin/tree-sitter"
          cmake --build build/c --parallel 2
      - name: Run Node.js binding tests
        run: npm test
      - name: Run Rust compatibility tests
        run: |
          cargo test --locked
          cargo test --locked --all-features
      - name: Run Rust tests on minimum supported runtime
        run: |
          cargo update -p tree-sitter --precise 0.25.10
          cargo test --locked
          cargo test --locked --all-features
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Check whitespace
        run: git diff --check

  package:
    name: Verify package artifacts
    runs-on: ubuntu-latest
    needs: [test, python, go, swift]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Rust package contents
        run: cargo package --locked
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: "24"
      - name: Install locked JavaScript dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Verify npm package contents
        run: npm pack --dry-run
      - name: Verify Python wheel contents
        run: python3 -m pip wheel --no-deps . --wheel-dir dist

  python:
    name: Test Python binding
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python binding and runtime
        run: python3 -m pip install . "tree-sitter~=0.25"
      - name: Run Python binding tests
        run: python3 -m unittest discover -s bindings/python/tests

  go:
    name: Test Go binding
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Go binding tests
        run: go test ./bindings/go

  swift:
    name: Test Swift binding
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Swift binding tests
        run: swift test
