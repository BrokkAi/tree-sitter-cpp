name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - Cargo.toml
      - Cargo.lock
      - package.json
      - package-lock.json
      - pyproject.toml
      - setup.py
      - tree-sitter.json
      - .github/workflows/**
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - Cargo.toml
      - Cargo.lock
      - package.json
      - package-lock.json
      - pyproject.toml
      - setup.py
      - tree-sitter.json
      - .github/workflows/**

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser and Rust binding
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: "24"
      - name: Install locked JavaScript dependencies
        shell: bash
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npm rebuild tree-sitter-cli
      - name: Verify generated parser
        shell: bash
        run: |
          npx tree-sitter generate --abi 14
          git diff --exit-code -- src
      - name: Run grammar corpus and highlight tests
        run: npx tree-sitter test
      - name: Run Rust compatibility tests
        run: cargo test --locked
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Check whitespace
        run: git diff --check

  package:
    name: Verify package artifacts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Rust package contents
        run: cargo package --locked
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: "24"
      - name: Install locked JavaScript dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Verify npm package contents
        run: npm pack --dry-run
      - name: Verify Python wheel contents
        run: python3 -m pip wheel --no-deps . --wheel-dir dist
